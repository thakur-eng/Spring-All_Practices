spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aadhar
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update       # (create, create-drop, validate, none, update)
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081                 # change per service (e.g., product=8081, order=8082)
